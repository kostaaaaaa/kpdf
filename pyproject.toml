[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kpdf"
dynamic = ["version"]            # taken from the latest git tag (v0.3.0 -> 0.3.0)
description = "Keyboard-driven PDF viewer with citation / equation / figure link previews"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"    # PyQt6 (GPL) and PyMuPDF (AGPL) both require a compatible license
license-files = ["LICENSE"]
keywords = ["pdf", "viewer", "keyboard", "vim", "pyqt6", "pymupdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
    "pymupdf>=2.0,<3",          # 2.x imports an ONNX layout stack on import (~0.5 s slower startup)
    "PyQt6>=6.4",
]

[project.urls]
Homepage = "https://github.com/<your-username>/kpdf"
Issues = "https://github.com/<your-username>/kpdf/issues"
Changelog = "https://github.com/<your-username>/kpdf/blob/main/CHANGELOG.md"

[project.scripts]
kpdf = "kpdf:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "pip-audit",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"       # used when building from a tarball without git metadata

# ------------------------------------------------------------------ ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplifications
    "C4",       # comprehensions
    "PIE", "RET",
]
ignore = [
    "E501",     # line length is the formatter's job; long comments/regexes are fine
    "SIM114",   # keep one `elif` per key in the key-binding table
    "SIM905",   # `"a b c".split()` is easier to read than a long list literal
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
